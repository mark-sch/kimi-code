name: Smartbox Native Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example smartbox-v2.6.3'
        required: true
        type: string
      version:
        description: 'Version reported by the CLI'
        required: true
        type: string
      sha:
        description: 'Source commit to build and release'
        required: true
        type: string

concurrency:
  group: smartbox-native-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  native:
    name: Native package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025-vs2026
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set CLI version
        shell: bash
        working-directory: apps/kimi-code
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set version="$VERSION"
      - run: pnpm install --frozen-lockfile
      - name: Verify web assets
        run: node apps/kimi-code/scripts/check-web-assets.mjs
      - name: Build native executable
        run: pnpm --filter @moonshot-ai/kimi-code run build:native:sea
      - name: Smoke test native executable
        run: pnpm --filter @moonshot-ai/kimi-code run test:native:smoke
      - name: Package native executable
        run: pnpm --filter @moonshot-ai/kimi-code run package:native
      - uses: actions/upload-artifact@v7
        with:
          name: smartbox-native-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error
          path: |
            apps/kimi-code/dist-native/artifacts/kimi-code-${{ matrix.target }}.zip
            apps/kimi-code/dist-native/artifacts/kimi-code-${{ matrix.target }}.zip.sha256

  publish:
    name: Publish GitHub release
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: smartbox-native-*
          path: dist-release
          merge-multiple: true
      - name: Produce manifest and compressed downloads
        run: node apps/kimi-code/scripts/native/produce-manifest.mjs dist-release '${{ inputs.tag }}'
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" dist-release/* \
              --target "$COMMIT" \
              --title "Smartbox AI $VERSION" \
              --generate-notes \
              --latest
          fi
